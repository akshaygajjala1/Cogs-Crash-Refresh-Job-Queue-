name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      COGS_TEST_REDIS: "1"
      REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Packages share the disposable Redis DB; do not run them concurrently.
      - run: go test -race -p 1 -count=1 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test demo/simulation.test.cjs
