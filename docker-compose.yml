services:
  redis:
    image: redis:7-alpine
    # AOF is not optional. Without it a Redis restart drops every pending job,
    # and "jobs survive restarts" stops being true. appendfsync everysec bounds
    # worst-case loss to one second of writes while costing far less than
    # fsyncing every command.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
      --save ""
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  cogs:
    build: .
    ports: ["8080:8080"]
    environment:
      REDIS_ADDR: redis:6379
      # Short leases trade heartbeat traffic for faster worker-crash recovery.
      DEFAULT_LEASE_SECONDS: "3"
      REAPER_INTERVAL_MS: "500"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
